<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Diwali Wishes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold: #f9d342;
      --deep-gold: #c59b27;
      --maroon: #2b080c;
      --dark-crimson: #160305;
      --card-bg: rgba(30, 4, 8, 0.85);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, var(--maroon) 0%, var(--dark-crimson) 100%);
      font-family: 'Poppins', sans-serif;
      color: #fff;
      overflow-x: hidden;
      padding: 16px;
      position: relative;
    }

    canvas#fireworks {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 520px;
      background: var(--card-bg);
      border: 2px solid var(--deep-gold);
      border-radius: 20px;
      padding: 36px 24px;
      text-align: center;
      box-shadow: 0 0 35px rgba(249, 211, 66, 0.25), inset 0 0 20px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
    }

    .card::before {
      content: "";
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      bottom: 8px;
      border: 1px dashed rgba(249, 211, 66, 0.4);
      border-radius: 14px;
      pointer-events: none;
    }

    .shloka {
      font-size: 0.95rem;
      color: var(--gold);
      letter-spacing: 1px;
      margin-bottom: 12px;
      font-weight: 300;
    }

    h1 {
      font-family: 'Cinzel Decorative', cursive;
      font-size: clamp(2rem, 6vw, 2.8rem);
      color: var(--gold);
      text-shadow: 0 0 15px rgba(249, 211, 66, 0.6);
      margin-bottom: 8px;
      line-height: 1.2;
    }

    .subtitle {
      font-size: 1.05rem;
      color: #fce8a6;
      margin-bottom: 24px;
    }

    /* Traditional Diya Styling */
    .diya-container {
      position: relative;
      width: 120px;
      height: 90px;
      margin: 0 auto 20px auto;
    }

    .flame {
      position: absolute;
      top: 2px;
      left: 50%;
      transform: translateX(-50%);
      width: 22px;
      height: 38px;
      background: linear-gradient(to bottom, #ffffff 0%, #ffe600 40%, #ff5e00 85%);
      border-radius: 50% 50% 20% 20% / 60% 60% 40% 40%;
      box-shadow: 0 0 20px #ff9900, 0 0 40px #ff4500;
      animation: flicker 1.2s infinite ease-in-out alternate;
      transform-origin: bottom center;
    }

    @keyframes flicker {
      0% { transform: translateX(-50%) scale(1) rotate(-1deg); opacity: 0.95; }
      50% { transform: translateX(-50%) scale(1.08) rotate(1deg); opacity: 1; }
      100% { transform: translateX(-50%) scale(0.96) rotate(-2deg); opacity: 0.9; }
    }

    .diya-base {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 42px;
      background: linear-gradient(to bottom, #d47a28, #7a3a08);
      border-radius: 0 0 100px 100px;
      box-shadow: inset 0 -4px 8px rgba(0, 0, 0, 0.6), 0 6px 12px rgba(0, 0, 0, 0.5);
      border-top: 3px solid #ffaa42;
    }

    .wish-message {
      font-size: 1rem;
      line-height: 1.6;
      color: #f7ede2;
      margin-bottom: 24px;
      padding: 0 8px;
    }

    .sender-tag {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--gold);
      margin-bottom: 24px;
    }

    /* Form & Buttons */
    .input-box {
      width: 100%;
      padding: 12px 16px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--deep-gold);
      border-radius: 8px;
      color: #fff;
      font-size: 0.95rem;
      margin-bottom: 12px;
      text-align: center;
      outline: none;
    }

    .input-box::placeholder {
      color: #c9af75;
    }

    .input-box:focus {
      border-color: var(--gold);
      box-shadow: 0 0 10px rgba(249, 211, 66, 0.4);
    }

    .btn {
      display: inline-block;
      width: 100%;
      padding: 12px 20px;
      background: linear-gradient(45deg, #c59b27, #f9d342);
      border: none;
      border-radius: 8px;
      color: #2b080c;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(249, 211, 66, 0.4);
    }

    .btn-share {
      background: #25D366;
      color: #fff;
      margin-top: 10px;
      display: none;
    }

    .btn-share:hover {
      box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4);
    }
  </style>
</head>
<body>

  <canvas id="fireworks"></canvas>

  <div class="card">
    <div class="shloka">॥ तमसो मा ज्योतिर्गमय ॥</div>
    <h1>Happy Diwali</h1>
    <div class="subtitle">Festival of Lights & Prosperity</div>

    <div class="diya-container">
      <div class="flame"></div>
      <div class="diya-base"></div>
    </div>

    <div id="senderDisplay" class="sender-tag"></div>

    <p class="wish-message">
      May the divine glow of diyas illuminate your life with endless peace, health, wealth, and eternal joy. Wishing you and your loved ones a blessed Deepavali!
    </p>

    <!-- Custom Wish Generation -->
    <input type="text" id="nameInput" class="input-box" placeholder="Enter your name to wish others" maxlength="30">
    <button class="btn" onclick="generateWish()">Create My Personalized Wish</button>
    <a id="shareBtn" class="btn btn-share" target="_blank">Share on WhatsApp 🪔</a>
  </div>

  <script>
    // 1. Read sender name from URL parameter
    const params = new URLSearchParams(window.location.search);
    const sender = params.get('from');
    const senderDisplay = document.getElementById('senderDisplay');

    if (sender) {
      senderDisplay.innerText = `— Warm Wishes From ${decodeURIComponent(sender)} —`;
    }

    // 2. Generate shareable custom link
    function generateWish() {
      const name = document.getElementById('nameInput').value.trim();
      if (!name) {
        alert('Please enter your name first!');
        return;
      }

      const shareUrl = `${window.location.origin}${window.location.pathname}?from=${encodeURIComponent(name)}`; const message = `🪔 *${name}* has sent you a classical Diwali wish! Open the diya here: ${shareUrl}`; const whatsappUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(message)}`;

      const shareBtn = document.getElementById('shareBtn');
      shareBtn.href = whatsappUrl;
      shareBtn.style.display = 'block';
      shareBtn.innerText = `Share on WhatsApp as ${name} 🪔`;
      
      // Update local card immediately
      senderDisplay.innerText = `— Warm Wishes From ${name} —`;
    }

    // 3. Background Sparkles & Firecracker Animation
    const canvas = document.getElementById('fireworks');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function createParticle(x, y) {
      const count = 25;
      const colors = ['#f9d342', '#ff9900', '#ff4500', '#ffffff', '#ffeb99'];
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 3 + 1;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          alpha: 1,
          decay: Math.random() * 0.02 + 0.015,
          color: colors[Math.floor(Math.random() * colors.length)],
          size: Math.random() * 2 + 1
        });
      }
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (Math.random() < 0.04) {
        createParticle(
          Math.random() * canvas.width,
          Math.random() * (canvas.height * 0.6)
        );
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.03; // gravity
        p.alpha -= p.decay;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
